agents.claude-code {
  adapter = claude-code
  bin = claude
  bin = ${?CLAUDE_BIN}
  tools = [Bash, Edit, Write, Read, Grep, Glob, "mcp__scala-semantic"]
  # verbatim .mcp.json text (GA run.sh:29 heredoc): key order and spacing are part of the parity contract. Three
  # strings concatenated with ${HOME} (no spaces between): `""""` closes the first string with a `"` inside it.
  mcp-json = """{ "mcpServers": { "scala-semantic": { "command": """"${HOME}"""/.local/bin/scalasemantic-mcp", "args": ["serve", "."] } } }"""
  allowed-mcp = [scala-semantic]
}
