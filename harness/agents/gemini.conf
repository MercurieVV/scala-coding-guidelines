agents.gemini {
  adapter = gemini-cli
  bin = gemini
  bin = ${?GEMINI_BIN}
  gemini-home = ${HOME}/.gemini     # holds tmp/<project>/chats (per-cwd sessions) and projects.json
  # MCP servers written to <repo>/.gemini/settings.json (mcpServers)
  mcp-servers {
    scala-semantic { command = ${HOME}"/.local/bin/scalasemantic-mcp", args = [serve, "."], timeout = 60000 }
  }
  allowed-mcp = [scala-semantic]
}
