agents.dsh {
  adapter = dsh
  bin = dsh
  profile = scala-headless          # derived by `harness dsh-profile --from scala`
  dsh-home = ${HOME}/.dsh
  dsh-home = ${?DSH_HOME}
  hooks-from = ".dsh/hooks.json"    # gated arms: hook map file in the run copy (Claude Code hook dialect)
  # model -> { input-per-mtok, output-per-mtok, cache-read-per-mtok } (USD); optional. deepseek-flash: DeepSeek's peak
  # rates as published 2026 (off-peak is half), an upper bound; checked 2026-10-12
  prices {
    deepseek-flash { input-per-mtok = 0.30, output-per-mtok = 1.20, cache-read-per-mtok = 0.006 }
  }
  scalasemantic-command = ${HOME}"/.local/bin/scalasemantic-mcp"  # written as <run copy>/scalasemantic-mcp.sh, the launcher the profile's MCP row runs
  allowed-mcp = [scalasemantic]     # env-leak check: MCP servers (from the request header's mcp__<server>__ tools) a run may have
}
