agents.codex {
  adapter = codex-cli
  bin = codex
  bin = ${?CODEX_BIN}
  codex-home = ${HOME}/.codex       # sessions/ is fenced off from runs (they run --ephemeral and write none)
  codex-home = ${?CODEX_HOME}
  # MCP servers written to <repo>/.codex/config.toml and passed as -c mcp_servers.<name>.* (untrusted projects ignore the file)
  mcp-servers {
    scala-semantic { command = ${HOME}"/.local/bin/scalasemantic-mcp", args = [serve, "."] }
  }
  allowed-mcp = [scala-semantic]
}
