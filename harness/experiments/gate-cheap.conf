# Item 17: does the gate pay on a cheaper model? dsh-u vs dsh-gs, deepseek-flash, 4 feature-request tasks, 2 reps.
#   harness warm-head --experiment experiments/gate-cheap.conf
#   harness baseline  --experiment experiments/gate-cheap.conf
#   harness campaign  --experiment experiments/gate-cheap.conf
#
# Pre-registered 2026-10-13, before any run:
#   failures per arm = unsolved + false_done + runs with regressions (n = 8 runs per arm)
#   u - gs >= 2  -> the gate pays on a cheaper model
#   u - gs <= 0  -> no gain
#   otherwise    -> unclear
#   dsh-u solves 8 of 8 -> the model is saturated on these tasks; next step is harder tasks
#   recorded, not decisive: median wall and cost per arm, gate blocks per run, every false_done and its route
#   budget: USD 5 of DeepSeek at peak rates (agents/dsh.conf prices, an upper bound); stop when the estimate reaches it
include "gate-ab.conf"
include "../agents/dsh.conf"
harness {
  root = ${HOME}/agent-eval-cheap
  root = ${?GA_ROOT}
  cap-seconds = 2700
  reps = [1, 2]
  tasks = [fr-pan, fr-exclusive-solo, fr-mode-leds, fr-tuning]
  arms = [dsh-u, dsh-gs]
  report { treatment = dsh-gs, control = dsh-u }
  chain-report { control = dsh-u, treatment = dsh-gs }
}
arms {
  dsh-u  = ${arms.u} { agent = dsh, model = deepseek-flash }
  dsh-gs = ${arms.gs} { agent = dsh, model = deepseek-flash }
}
