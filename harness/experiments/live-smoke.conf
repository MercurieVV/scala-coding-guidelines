# Task 20 live smoke: one run per agent on fr-pan, rep 1, in a fresh root.
#   harness warm-head --experiment experiments/live-smoke.conf
#   harness campaign  --experiment experiments/live-smoke.conf --set harness.tasks=[fr-pan] --set harness.reps=[1]
# A subset of arms: --set 'harness.arms=[claude-u]'. The dsh arms need the headless profile (`harness dsh-profile --from scala`).
include "gate-ab.conf"
include "../agents/dsh.conf"
include "../agents/codex.conf"
include "../agents/gemini.conf"
# Gemini through the Antigravity CLI (gemini-cli's login is refused: IneligibleTierError); no transcript, diff-only scoring
agents.agy {
  adapter = generic
  command = [${HOME}/.local/bin/agy, "-p", "{prompt}", "--model", "{model}", "--dangerously-skip-permissions",
             "--print-timeout", "20m"]          # = cap-seconds; agy's own default is 5m
  transcript = none
}
harness {
  root = ${HOME}/agent-eval-live
  root = ${?GA_ROOT}
  cap-seconds = 1200                # wall cap per agent run (gate-ab: 2700); a runaway agent is killed at 20 min
  reps = [1]
  tasks = [fr-pan]
  arms = [dsh-u, dsh-gs, codex-u, gemini-u, claude-u, agy-u]
  report { treatment = dsh-gs, control = dsh-u }
  chain-report { control = dsh-u, treatment = dsh-gs }
}
arms {
  claude-u = ${arms.u}
  dsh-u    = ${arms.u} { agent = dsh, model = deepseek-flash }
  dsh-gs   = ${arms.gs} { agent = dsh, model = deepseek-flash }
  # Codex / Gemini: --ignore-user-config drops ~/.codex/config.toml's model, so it is named here (the user's configured
  # default); gemini-2.5-pro is gemini-cli 0.38.1's DEFAULT_GEMINI_MODEL.
  codex-u  = ${arms.u} { agent = codex, model = gpt-5.5 }
  gemini-u = ${arms.u} { agent = gemini, model = gemini-2.5-pro }
  agy-u    = ${arms.u} { agent = agy, model = gemini-3.1-pro-high }
}
